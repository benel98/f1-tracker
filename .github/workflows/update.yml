name: F1 2026 Daily Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run F1 updater
        run: python update_f1.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add f1-2026-standalone.html
          if git diff --cached --quiet; then
            echo "No changes detected - standings unchanged since last run."
          else
            RACES=$(python -c "import re; html=open('f1-2026-standalone.html').read(); print(len(re.findall(r'\"status\":\s*\"completed\"', html)))")
            git commit -m "Update F1 standings - ${RACES} races completed [skip ci]"
            git push
            echo "Changes committed and pushed."
          fi
          
