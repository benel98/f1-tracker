name: 🏎️ F1 2026 Daily Update

on:
  schedule:
    # Every day at 06:00 UTC (good timing — most races are Sunday, results appear by Monday morning)
    - cron: "0 6 * * *"
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated HTML

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run F1 updater
        run: python update_f1.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add f1-2026-standalone.html
          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes detected — standings unchanged since last run."
          else
            RACE_COUNT=$(python - <<'EOF'
import re, sys
html = open("f1-2026-standalone.html").read()
m = re.search(r'"completed"', html)
races = len(re.findall(r'"status":\s*"completed"', html))
print(f"Update standings · {races} races completed")
EOF
            )
            git commit -m "🏎️ $RACE_COUNT [skip ci]"
            git push
            echo "✅ Changes committed and pushed."
          fi
